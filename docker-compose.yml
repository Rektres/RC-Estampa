services:
  db:
    image: postgres:16-alpine
    environment:
      # ":?" aborta el "up" si la variable falta en el .env. Sin esto compose solo
      # avisa y sigue con un string vacío, y el backend cae en SQLite sin decir nada.
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en el .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en el .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    # Sin "ports": el nginx del frontend lo alcanza por la red interna de Docker
    # (proxy_pass http://backend:8000). Publicarlo solo suma conflictos y exposición.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    volumes:
      - media:/usr/share/nginx/media:ro
    ports:
      # PUERTO_HOST:80 — el 80 de la derecha es donde escucha nginx DENTRO del
      # contenedor; no cambiarlo. Para mover el puerto público usar FRONTEND_PORT.
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pgdata:
  media:
