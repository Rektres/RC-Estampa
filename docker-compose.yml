name: rc-estampa

services:
  db:
    image: postgres:16-alpine
    container_name: rc_estampa_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en el .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en el .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rc_estampa_backend
    env_file: .env
    volumes:
      - media:/app/media
    restart: unless-stopped
    # Sin "ports" hacia el host: el nginx del frontend lo alcanza internamente por
    # la red de Docker (proxy_pass http://backend:8000). Evita choques con el puerto 8000.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: rc_estampa_frontend
    depends_on:
      - backend
    volumes:
      - media:/usr/share/nginx/media:ro
    ports:
      # Puerto público en el host : puerto 80 dentro del contenedor.
      # Por defecto usa 8088 para no chocar con puertos 80/8080/3000/5000/8000 de otros proyectos.
      - "${FRONTEND_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
    name: rc_estampa_pgdata
  media:
    name: rc_estampa_media

